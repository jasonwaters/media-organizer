[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-organizer"
version = "1.0.0"
description = "Organize downloaded media files and notify Sonarr"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3.0",
  "transmission-rpc>=4.3,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
media-organizer = "media_organizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
